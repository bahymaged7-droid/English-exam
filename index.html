<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Year 5 English – Learning Check 1</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#5d6679;--ac:#2f5fd0;--bd:#d9deea;--ok:#1c8a4b;--no:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1c212c;--tx:#e8ecf4;--mu:#9aa3b5;--ac:#6f95f2;--bd:#323a4b;--ok:#4cc27f;--no:#ef7b6e}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1c212c;--tx:#e8ecf4;--mu:#9aa3b5;--ac:#6f95f2;--bd:#323a4b;--ok:#4cc27f;--no:#ef7b6e}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:14px 0}
h1{font-size:22px;margin:6px 0}h2{font-size:18px;margin:0 0 8px;color:var(--ac)}
.mu{color:var(--mu);font-size:14px}
.q{margin:14px 0;padding-top:12px;border-top:1px solid var(--bd)}.q:first-of-type{border-top:0}
.q b{display:block;margin-bottom:6px}
label.o{display:block;padding:9px 12px;margin:6px 0;border:1px solid var(--bd);border-radius:10px;cursor:pointer}
label.o:has(input:checked){border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}
input[type=text],textarea,input.nm{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
input[type=text]{min-width:150px;max-width:100%}textarea,input.nm{width:100%}textarea{min-height:64px}
.box{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:8px 0}
.pass p{margin:0 0 10px}
button{font:inherit;font-weight:600;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 22px;cursor:pointer;width:100%;margin-top:6px}
.big{font-size:44px;font-weight:700;text-align:center;margin:4px 0}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.wr{border-left:4px solid var(--no);padding:6px 10px;margin:8px 0;background:var(--bg);border-radius:6px;font-size:15px}
.ok{color:var(--ok)}.no{color:var(--no)}
</style></head><body><main id="app"></main>
<script>
let E=[{"name":"Exam 1","secs":[{"t":"Reading Comprehension: A Day at the Beach","p":"<div class=\"pass\"><p>Last Saturday, a group of students visited a beach with their teachers. They were excited because they were going to learn about marine life and how to protect the environment. Before they started, their teacher explained that rubbish can be dangerous for sea animals.</p><p>At first, Sami felt nervous because he had never taken part in a beach clean-up before. His friend Lina was calm and encouraged him to join her. Together, they collected plastic bottles, bags and other rubbish from the sand. Lina was very generous and shared her gloves with another student who had forgotten to bring a pair.</p><p>After an hour, Sami began to feel tired and developed a headache. His teacher asked him to sit in the shade and drink some water. After a short rest, he felt better and decided to continue helping his friends.</p><p>During the clean-up, the students also noticed some birds searching for food near the rubbish. Their teacher explained that plastic and other waste can harm animals if they eat it or become trapped in it. The students became more careful as they worked and made sure they collected even the smallest pieces of rubbish.</p><p>By the end of the morning, the beach looked much cleaner. The students were proud of their work. They realised that small actions can make a big difference to the environment and that everyone has a responsibility to protect marine life.</p></div>","q":[["m","Why did the students visit the beach?",["To learn about protecting the environment.","To play games on the sand.","To go swimming with their teachers."],[0]],["m","Why was Sami nervous at first?",["He was afraid of the sea.","He had never joined a beach clean-up before.","He did not want to work with his friends."],[1]],["m","What does the word “generous” mean in the passage?",["Willing to share and help others.","Feeling worried about something.","Feeling tired after working."],[0]],["m","What did the students collect from the beach?",["Shells, stones and seaweed.","Plastic bottles, bags and other rubbish.","Food, clothes and old toys."],[1]],["m","What happened to Sami after an hour?",["He went swimming in the sea.","He became angry with his friends.","He developed a headache."],[2]],["m","What can we infer about the students at the end of the visit?",["They understood that protecting the environment is important.","They thought cleaning the beach was a waste of time.","They decided that only teachers should protect marine life."],[0]],["m","What did the students do to help protect the environment?",["They collected rubbish from the beach.","They played games on the sand.","They went swimming all morning."],[0]]]},{"t":"Read the text in each question. What does it say?","p":"","q":[["m","Message: “John, You know I said that football practice will be on Wednesday … Well, it isn’t – it’s on Thursday. Sorry! See you then. Cheers, Adam”<br>Why has Adam written this message?",["to ask if John wants to play football","to tell John that Adam can’t play football","to let John know about a change of plan"],[2]],["m","Poster: “SCHOOL FESTIVAL OF BOOKS. Meet Ralph Sparks. Hear how he got ideas for his books, including History of Exploring the New World. Thurs 9 a.m. Room D31.”<br>Pupils can …",["buy books.","read about explorers.","come and listen to a writer."],[2]],["m","Notice: “Science Museum trip next Friday. Tickets are available for $4 (for coach transport to the museum, and for museum entry). If you’re interested, see Mr Goss.”",["You can now buy tickets for the museum trip.","Tell Mr Goss how you want to travel to the museum.","Mr Goss will tell you if you need a ticket to the museum."],[0]],["m","Library notice: “The library will be closed next Monday for building work. It will reopen on Wednesday at 8 a.m. You can return books at the main office.”<br>What will happen on Wednesday?",["The library will reopen.","The library will close for building work.","Pupils will return their books at the main office."],[0]]]},{"t":"Use of English – Part A: Present Simple","p":"","q":[["m","Ahmed ______ football every Friday.",["play","plays","playing","played"],[1]],["m","My family ______ to the beach on weekends.",["going","goes","gone","went"],[1]],["m","Choose the correct sentence.",["Sara go to school by bus.","Sara goes to school by bus.","Sara going to school by bus.","Sara gone to school by bus."],[1]],["m","The sun ______ brightly in the UAE.",["shine","shining","shines","shined"],[2]],["m","Omar watches TV before school. Choose the negative sentence.",["Omar doesn’t watch TV before school.","Omar don’t watch TV before school.","Omar doesn’t watches TV before school."],[0]],["m","Mariam visits Dubai Mall on Saturdays. Choose the correct question.",["Does Mariam visits Dubai Mall on Saturdays?","Does Mariam visit Dubai Mall on Saturdays?","Do Mariam visit Dubai Mall on Saturdays?"],[1]],["m","Choose the correct sentence.",["My brother sleep after school.","My brother sleeping after school.","My brother sleeps after school."],[2]],["m","Match the subject with the verb: “My sister ___”",["enjoys","visit","play"],[0]],["m","Match the subject with the verb: “The children ___”",["enjoys","visit","play"],[1,2]],["m","Match the subject with the verb: “We ___”",["enjoys","visit","play"],[1,2]],["m","Ali: What does your family do at the weekend?<br>Omar: We ______ the park …",["visits","visiting","visit","visited"],[2]],["m","Omar: We visit the park and ______ football.",["plays","playing","played","play"],[3]],["m","Choose the correct sentence about what someone usually does after school.",["I usually does my homework after school.","I usually doing my homework after school.","I usually do my homework after school."],[2]]]},{"t":"Use of English – Part B: Modal Verbs","p":"","q":[["m","You ______ wear your seat belt in a car.",["can","must","might","could"],[1]],["m","You ______ bring your swimming clothes if we go to the waterpark.",["might","mustn’t","can’t","shouldn’t"],[0]],["m","(Sign: no food or drink) Students ______ eat in the classroom.",["might","mustn’t","must","should"],[1]],["m","Match the modal verb with its purpose: “can”",["advice","ability","rule/necessity"],[1]],["m","Match the modal verb with its purpose: “must”",["advice","ability","rule/necessity"],[2]],["m","Match the modal verb with its purpose: “should”",["advice","ability","rule/necessity"],[0]],["m","Choose the sentence that gives advice.",["You must wear a school uniform.","You should drink plenty of water.","You can swim.","You might visit Dubai."],[1]],["m","It is a good idea to study before the test. Choose the sentence with should.",["You should study before the test.","You should to study before the test.","You should studying before the test."],[0]],["m","Students ______ use their phones during the lesson.",["mustn’t","can","might","could"],[0]],["m","“I can ride a bicycle.” What does can show?",["Permission","Ability","Advice","Possibility"],[1]],["m","Choose the correct sentence.",["You should to listen to your teacher.","You should listen to your teacher.","You should listening to your teacher."],[1]],["m","Choose the correct sentence using could.",["We could to visit the desert during the holiday.","We could visiting the desert during the holiday.","We could visit the desert during the holiday."],[2]]]},{"t":"Vocabulary: What does the word mean?","p":"","q":[["m","What does “cheerful” mean?",["relaxed and not worried","quick to become angry","happy and positive in a pleasant way"],[2]],["m","What does “nervous” mean?",["feeling worried or anxious","friendly and enjoys meeting people","willing to share"],[0]],["m","What does “calm” mean?",["pain in your head","relaxed and not worried","a high body temperature"],[1]],["m","What does “bad-tempered” mean?",["happy and positive","willing to give or share","quick to become angry or annoyed"],[2]],["m","What does “generous” mean?",["willing to give or share with others","feeling worried","pain in your stomach"],[0]],["m","What does “outgoing” mean?",["relaxed and not worried","friendly and enjoys meeting and talking to new people","quick to become angry"],[1]],["m","What does “sore throat” mean?",["pain in your tummy","pain in your head","pain when you swallow"],[2]],["m","What does “stomach ache” mean?",["pain in your stomach or tummy","pain in your head","a high body temperature"],[0]],["m","What does “fever” mean?",["pain in your throat","a high body temperature, feeling hot and unwell","pain in your stomach"],[1]],["m","What does “headache” mean?",["pain when you swallow","feeling hot and unwell","pain in your head"],[2]]]},{"t":"Vocabulary: Fill in the blanks","p":"","q":[["m","Huda felt ______ before performing on stage.",["nervous","cheerful","generous"],[0]],["m","My friend is very ______ and always shares her things with others.",["nervous","generous","bad-tempered"],[1]],["m","Ali was ______ because he received some good news.",["nervous","bad-tempered","cheerful"],[2]],["m","It hurts when I swallow because I have a ______.",["sore throat","headache","fever"],[0]],["m","I need to rest because I have a terrible ______.",["fever","headache","generous"],[1]]]},{"t":"Vocabulary: Choose the correct answer","p":"","q":[["m","Which word describes someone who is happy and positive?",["cheerful","nervous","bad-tempered"],[0]],["m","Someone who enjoys meeting and talking to new people is ______.",["calm","outgoing","nervous"],[1]],["m","Which word describes someone who easily becomes angry or annoyed?",["generous","cheerful","bad-tempered"],[2]],["m","You feel very hot and unwell. You probably have a ______.",["fever","sore throat","stomach ache"],[0]],["m","If your tummy hurts, you have a ______.",["headache","stomach ache","sore throat"],[1]],["m","Which word describes someone who is relaxed and not worried?",["outgoing","nervous","calm"],[2]]]}]},{"name":"Exam 2","secs":[{"t":"Reading Comprehension: A Day at the Farm","p":"<div class=\"pass\"><p>On Thursday, Year 5 went on a trip to a farm near Al Ain. The children were cheerful on the bus because they were going to learn where food comes from. The farmer welcomed them and showed them how to look after the animals.</p><p>Huda felt nervous at first because she had never touched a goat before. Her friend Omar was outgoing and talked to the farmer happily. He told Huda that the goats were gentle. Soon, Huda was feeding them and smiling.</p><p>Then the students collected eggs and picked fresh tomatoes. Omar was generous and gave some of his tomatoes to a boy who had not found any. After lunch, Omar ate too much and got a stomach ache. The teacher asked him to sit down and rest. He felt better after twenty minutes.</p><p>Before they left, the farmer explained that farms need water and care. The students promised to save water at home. They understood that everyone can help to protect nature.</p></div>","q":[["m","Why did Year 5 go to the farm?",["To learn where food comes from.","To ride horses.","To play football."],[0]],["m","Why was Huda nervous at first?",["She was afraid of the farmer.","She had never touched a goat before.","She did not like tomatoes."],[1]],["m","What does the word “outgoing” mean in the passage?",["Friendly and happy to talk to people.","Quick to become angry.","Feeling pain in the head."],[0]],["m","What did the students collect and pick?",["Eggs and tomatoes.","Stones and shells.","Milk and bread."],[0]],["m","What happened to Omar after lunch?",["He got a stomach ache.","He lost his bag.","He fell asleep on the bus."],[0]],["m","What can we infer about the students at the end of the trip?",["They learned that saving water is important.","They thought farms are boring.","They wanted to leave early."],[0]],["m","How did Omar show that he was generous?",["He ate all the tomatoes himself.","He took eggs from the farmer.","He gave some of his tomatoes to a boy who had not found any."],[2]]]},{"t":"Read the text in each question. What does it say?","p":"","q":[["m","Message: “Sara, the swimming lesson is not at 4 o’clock today – it’s at 5. See you at the pool! Hana”<br>Why has Hana written this message?",["to invite Sara to a party","to tell Sara about a change of time","to say she can’t swim"],[1]],["m","Notice: “School Bake Sale on Tuesday. Cakes cost 3 dirhams. All the money will buy new books for the library. Come to the hall at 10 a.m.”<br>What can pupils do?",["Buy cakes to help the library.","Borrow books from the hall.","Learn to bake in the library."],[0]]]},{"t":"Use of English – Part A: Present Simple","p":"","q":[["m","My sister ______ breakfast at seven o’clock.",["eat","eats","eating","ate"],[1]],["m","The students ______ to school by bus.",["goes","going","go","went"],[2]],["m","Choose the correct sentence.",["Khalid play basketball on Sundays.","Khalid plays basketball on Sundays.","Khalid playing basketball on Sundays.","Khalid played basketball on Sundays."],[1]],["m","Fatima ______ her homework every day.",["do","doing","done","does"],[3]],["m","Hamad likes fish. Choose the negative sentence.",["Hamad don’t like fish.","Hamad doesn’t likes fish.","Hamad doesn’t like fish."],[2]],["m","Noor walks to school. Choose the correct question.",["Does Noor walk to school?","Does Noor walks to school?","Do Noor walk to school?"],[0]],["m","Choose the correct sentence.",["My father work in Abu Dhabi.","My father works in Abu Dhabi.","My father working in Abu Dhabi."],[1]],["m","My cousins ______ in Sharjah.",["live","lives","living","lived"],[0]],["m","Choose the correct sentence about a family weekend.",["My family visit the beach at the weekend.","My family visiting the beach at the weekend.","My family visits the beach at the weekend."],[2]]]},{"t":"Use of English – Part B: Modal Verbs","p":"","q":[["m","You ______ stop at a red light.",["can","must","might","could"],[1]],["m","It is cold today. You ______ wear a jacket.",["should","mustn’t","can’t","might"],[0]],["m","(Sign: no running) Children ______ run in the corridor.",["might","must","mustn’t","should"],[2]],["m","“She can speak three languages.” What does can show?",["Permission","Ability","Advice","Possibility"],[1]],["m","“You must wear a helmet.” What does must show?",["Advice","Rule/necessity","Ability","Possibility"],[1]],["m","I ______ visit the desert tomorrow, but I am not sure.",["must","mustn’t","might","can’t"],[2]],["m","It is a good idea to drink water. Choose the sentence with should.",["You should drink water.","You should to drink water.","You should drinking water."],[0]],["m","Choose the correct sentence.",["You must to wear a helmet.","You must wear a helmet.","You must wearing a helmet."],[1]],["m","Choose the correct sentence using could.",["We could to visit a museum on the school trip.","We could visiting a museum on the school trip.","We could visit a museum on the school trip."],[2]]]},{"t":"Vocabulary: Choose the word that fits","p":"","q":[["m","Layla always smiles and says good morning to everyone. She is ______.",["cheerful","nervous","bad-tempered"],[0]],["m","Omar’s hands shake before the big match. He feels ______.",["calm","nervous","generous"],[1]],["m","The sea is quiet and the teacher speaks softly. Everyone is ______.",["bad-tempered","nervous","calm"],[2]],["m","Khalid shouts at his friends when he is annoyed. He is ______.",["bad-tempered","cheerful","generous"],[0]],["m","Mona gives half of her lunch to a new student. She is ______.",["outgoing","generous","nervous"],[1]],["m","Rashid loves meeting new people and talks to everyone at the party. He is ______.",["calm","bad-tempered","outgoing"],[2]],["m","It hurts when Hessa drinks juice. She has a ______.",["sore throat","stomach ache","headache"],[0]],["m","Saif ate too much pizza and his tummy hurts. He has a ______.",["sore throat","stomach ache","fever"],[1]],["m","Dana feels very hot and weak and her temperature is high. She has a ______.",["headache","stomach ache","fever"],[2]],["m","Noura’s head hurts after the loud music. She has a ______.",["headache","sore throat","fever"],[0]]]},{"t":"Vocabulary: Fill in the blanks","p":"","q":[["m","Sara felt ______ before her first swimming race.",["nervous","cheerful","generous"],[0]],["m","Our neighbour is very ______ and gives food to families who need it.",["nervous","generous","bad-tempered"],[1]],["m","Ahmed ate too much cake and now he has a ______.",["sore throat","headache","stomach ache"],[2]],["m","Lina stayed in bed because she had a high ______.",["fever","sore throat","calm"],[0]],["m","My teacher is always ______ and smiles at everyone.",["nervous","cheerful","bad-tempered"],[1]]]},{"t":"Vocabulary: Choose the correct answer","p":"","q":[["m","Which word means relaxed and not worried?",["calm","nervous","bad-tempered"],[0]],["m","Which word describes someone friendly who enjoys meeting new people?",["generous","outgoing","calm"],[1]],["m","Which word means pain in your head?",["headache","sore throat","fever"],[0]],["m","It hurts when you swallow. You have a ______.",["fever","headache","sore throat"],[2]],["m","Which word describes a person who likes to share with others?",["generous","nervous","bad-tempered"],[0]]]}]}];
const DB="https://english-exam-73b64-default-rtdb.europe-west1.firebasedatabase.app";
async function save(S,T,p){const el=document.getElementById('sv');
 try{const r=await fetch(DB+'/results.json',{method:'POST',body:JSON.stringify({name:stu.slice(0,79),parts:res.map((r,i)=>({title:E[i].name,sc:r.sc,tot:r.tot})),total:S,max:T,pct:p,ts:Date.now(),writ:[].concat(...res.map(r=>r.writ))})});
 if(!r.ok)throw new Error(r.status);el.textContent='✓ Your result was sent to your teacher.'}
 catch(e){el.textContent='⚠ Your result could not be sent. Please show this screen to your teacher.'}}
const $=s=>document.querySelector(s),app=$('#app');
let cur=0,res=[],stu='';
const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/-/g,' ').replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');

function start(){
 app.innerHTML=`<div class="card"><h1>Year 5 English – Learning Check 1</h1><p class="mu">Answer all the questions. When you submit an exam, the next one appears (if there is one). Your score is shown at the very end.</p><input class="nm" id="nm" placeholder="Your name and section" autocomplete="off"><button id="go">Start</button></div>`;
 $('#go').onclick=()=>{stu=$('#nm').value.trim();if(!stu){$('#nm').focus();return}cur=0;show()};
}
function show(){
 const ex=E[cur];let h=`<div class="card"><h1>${ex.name} <span class="mu">(${cur+1} of ${E.length})</span></h1><div class="bar"><i style="width:${cur*100/E.length}%"></i></div><p class="mu">${esc(stu)}</p></div>`;
 ex.secs.forEach((s,i)=>{
  h+=`<div class="card"><h2>${s.t}</h2>${s.p}`;
  s.q.forEach((q,k)=>{
   const id=`q${i}_${k}`;let body='';
   if(q[0]=='m')body=q[2].map((o,j)=>`<label class="o"><input type="radio" name="${id}" value="${j}"> ${String.fromCharCode(65+j)}. ${o}</label>`).join('');
   else if(q[0]=='f'){const inp=`<input type="text" id="${id}" autocomplete="off" autocapitalize="off" spellcheck="false">`;body=q[1].includes('___')?'':inp}
   else body=`<textarea id="${id}"></textarea>`;
   const txt=q[0]=='f'&&q[1].includes('___')?q[1].replace('___',`<input type="text" id="${id}" autocomplete="off" autocapitalize="off" spellcheck="false">`):q[1];
   h+=`<div class="q"><b>${k+1}. ${txt}</b>${body}</div>`;
  });
  h+='</div>';
 });
 h+=`<button id="sub">${cur<E.length-1?'Submit and go to the next exam':'Submit and see my score'}</button>`;
 app.innerHTML=h;scrollTo(0,0);$('#sub').onclick=submit;
}
function val(id,t){
 if(t=='m'){const c=document.querySelector(`input[name="${id}"]:checked`);return c?c.value:''}
 return document.getElementById(id).value.trim();
}
function submit(){
 const ex=E[cur];let un=0;
 ex.secs.forEach((s,i)=>s.q.forEach((q,k)=>{if(!val(`q${i}_${k}`,q[0]))un++}));
 if(un&&!confirm(`You left ${un} question(s) empty. Submit anyway?`))return;
 let sc=0,tot=0,wrong=[],writ=[];
 ex.secs.forEach((s,i)=>s.q.forEach((q,k)=>{
  const v=val(`q${i}_${k}`,q[0]);tot++;let ok,cor,mine=v;
  if(q[0]=='m'){const A=[].concat(q[3]);ok=v!==''&&A.includes(+v);cor=A.map(j=>q[2][j]).join(' / ');mine=v===''?'':q[2][+v]}
  else if(q[0]=='f'){ok=q[2].map(norm).includes(norm(v));cor=q[2][0]}
  else{const n=norm(v);writ.push(q[1].replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,70)+' → '+v);ok=n.split(' ').filter(Boolean).length>=3&&(!q[2]||n.includes(norm(q[2])));cor=q[2]?`a full sentence using “${q[2]}”`:'a full sentence (3+ words)'}
  if(ok)sc++;else wrong.push({sec:s.t,n:k+1,q:q[1].replace(/<[^>]*>/g,' '),mine,cor});
 }));
 res[cur]={sc,tot,wrong,writ};
 if(cur<E.length-1){cur++;show()}else finish();
}
function finish(){
 const S=res.reduce((a,r)=>a+r.sc,0),T=res.reduce((a,r)=>a+r.tot,0),p=Math.round(S/T*100);
 let h=`<div class="card"><h1>Well done, ${esc(stu)}!</h1><p class="mu">Your final result</p><div class="big">${S} / ${T}</div><div class="bar"><i style="width:${p}%"></i></div><p style="text-align:center;font-weight:600">${p}%</p>
 <p>${res.map((r,i)=>esc(E[i].name)+': <b>'+r.sc+' / '+r.tot+'</b>').join('<br>')}</p>
 <p id="sv" class="mu">Sending your result to your teacher…</p><p class="mu">Sentence-writing questions are marked automatically (a full sentence using the required word), so your teacher may check them again.</p></div>`;
 res.forEach((r,i)=>{
  h+=`<div class="card"><h2>${E[i].name}: questions to review (${r.wrong.length})</h2>`;
  h+=r.wrong.length?r.wrong.map(w=>`<div class="wr"><b>${esc(w.sec)} – Q${w.n}</b><br>${esc(w.q)}<br>Your answer: <span class="no">${esc(w.mine)||'(empty)'}</span><br>Correct: <span class="ok">${esc(w.cor)}</span></div>`).join(''):'<p class="ok">All correct!</p>';
  h+='</div>';
 });
 h+='<button id="again">Try again</button>';
 app.innerHTML=h;scrollTo(0,0);$('#again').onclick=()=>{res=[];start()};save(S,T,p);
}
const cq=q=>q.type==='m'?['m',esc(q.text||'').replace(/\n/g,'<br>'),(q.opts||[]).map(esc),[].concat(q.ans||[])]:q.type==='f'?['f',esc(q.text||'').replace(/\n/g,'<br>'),[].concat(q.ans||[])]:['w',esc(q.text||'').replace(/\n/g,'<br>'),q.kw||''];
const cx=x=>({name:x.title||'Exam',secs:Object.values(x.secs||{}).map(c=>({t:esc(c.t||''),p:c.p?'<div class="pass">'+c.p.split(/\n+/).map(l=>'<p>'+esc(l)+'</p>').join('')+'</div>':'',q:Object.values(c.q||{}).map(cq)}))});
async function loadExams(){try{const a=await(await fetch(DB+'/config/active.json')).json();const ids=Object.values(a||{});if(!ids.length)return;
 const L=[];for(const id of ids){const x=await(await fetch(DB+'/exams/'+id+'.json')).json();if(x&&x.secs)L.push(cx(x))}if(L.length)E=L}catch(e){}}
loadExams().then(start);
</script></body></html>
