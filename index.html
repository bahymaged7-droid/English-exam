<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة مستر محمد البهي لتعليم الإنجليزية</title>
<style>
:root{--bg:#f3f1ff;--card:#fff;--tx:#1f2340;--mu:#666d8a;--bd:#e0def5;--ac:#5b5bf0;--ok:#16a05a;--no:#d9402f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#14152a;--card:#1f2140;--tx:#eef0ff;--mu:#a2a8cc;--bd:#34376a;--ac:#8c8cff;--ok:#4cc27f;--no:#ef7b6e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
main{max-width:780px;margin:0 auto;padding:14px}
.hero{background:linear-gradient(135deg,#5b5bf0,#9b4dff 55%,#ff6fa5);color:#fff;text-align:center;padding:34px 18px 42px;border-radius:0 0 32px 32px}
.hero h1{margin:8px 0;font-size:clamp(21px,5vw,32px);line-height:1.45}.hero p{margin:4px 0;opacity:.93}.big{font-size:52px;font-weight:800}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 4px 14px rgba(91,91,240,.08)}
h2{font-size:18px;margin:0 0 10px;color:var(--ac)}label{display:block;margin:10px 0;font-weight:600}
input[type=text],select{display:block;width:100%;font:inherit;color:var(--tx);background:var(--bg);border:2px solid var(--bd);border-radius:12px;padding:11px 12px;margin-top:5px}
.btn{display:block;width:100%;font:inherit;font-weight:700;color:#fff;background:linear-gradient(135deg,#5b5bf0,#9b4dff);border:0;border-radius:14px;padding:13px 18px;cursor:pointer;text-align:center;text-decoration:none;margin-top:10px}
.sm{font:inherit;font-weight:600;background:rgba(255,255,255,.22);color:inherit;border:1px solid var(--bd);border-radius:10px;padding:6px 12px;cursor:pointer}
.bar{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#5b5bf0,#9b4dff);color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px))}.bar .sm{color:#fff;border-color:rgba(255,255,255,.5)}
.pills{display:flex;gap:8px;overflow-x:auto}.pill{flex:1;min-width:104px;font:inherit;font-weight:700;background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:14px;padding:8px;cursor:pointer}.pill small{display:block;font-weight:400;color:var(--mu)}.pill.on{background:var(--ac);color:#fff;border-color:var(--ac)}.pill.on small{color:#fff}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.sc{font:inherit;color:#fff;border:3px solid transparent;border-radius:18px;padding:14px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}.sc span{font-size:30px}.sc small{opacity:.9}.sc.on{border-color:var(--tx);transform:translateY(-3px)}
.c-explain{background:linear-gradient(135deg,#14b8a6,#0ea5e9)}.c-practice{background:linear-gradient(135deg,#f59e0b,#f97316)}.c-exam{background:linear-gradient(135deg,#ec4899,#8b5cf6)}
.it{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd)}.it:last-child{border:0}.it .btn{width:auto;margin:0;padding:8px 16px}
.mu{color:var(--mu)}.er{color:var(--no);font-weight:600}.ok{color:var(--ok)}.no{color:var(--no)}
.q{margin:14px 0;padding-top:12px;border-top:1px solid var(--bd)}.q:first-of-type{border-top:0}.q b{display:block;margin-bottom:6px}
label.o{font-weight:400;padding:9px 12px;margin:6px 0;border:2px solid var(--bd);border-radius:12px;cursor:pointer}label.o:has(input:checked){border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}
.pass p{margin:0 0 10px}.wr{border-left:4px solid var(--no);padding:6px 10px;margin:8px 0;background:var(--bg);border-radius:6px;font-size:15px}
.logo{display:block;margin:0 auto 12px;object-fit:cover;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90%}.logo.S{width:110px}.logo.M{width:200px}.logo.L{width:min(90%,320px)}.logo.round{border-radius:50%;aspect-ratio:1}.logo.rounded{border-radius:28px}.logo.rect{border-radius:4px}
.g12{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}@media(min-width:560px){.g12{grid-template-columns:repeat(4,1fr)}}
.gb{font:inherit;color:#fff;background:hsl(var(--h) 72% 50%);border:3px solid transparent;border-radius:16px;padding:14px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center}.gb b{font-size:28px;line-height:1.1}.gb small{opacity:.95}.gb.on{border-color:var(--tx)}
iframe{background:#fff}
</style></head><body><div id="app"></div>
<script>
const DB="https://english-exam-73b64-default-rtdb.europe-west1.firebasedatabase.app";
const $=s=>document.querySelector(s),app=$('#app');
const GR=['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر','الحادي عشر','الثاني عشر'];
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
let S={name:'',grade:0,term:1,sec:'practice'},L={},X={},ex,xid;
try{Object.assign(S,JSON.parse(localStorage.getItem('plat')||'{}'))}catch(e){}
const keep=()=>{try{localStorage.setItem('plat',JSON.stringify(S))}catch(e){}};
const cnt=x=>Object.values(x.secs||{}).reduce((s,c)=>s+Object.values(c.q||{}).length,0);
let SITE=null;
async function loadSite(){try{const r=await fetch(DB+'/site.json');if(r.ok)SITE=await r.json()}catch(e){}}
function home(){const ok=SITE&&typeof SITE.img==='string'&&SITE.img.startsWith('data:image/');
 const lg=ok?`<img class="logo ${['round','rounded','rect'].includes(SITE.shape)?SITE.shape:'rounded'} ${['S','M','L'].includes(SITE.size)?SITE.size:'L'}" src="${esc(SITE.img)}" alt="">`:'<div style="font-size:56px">🎓</div>';
 app.innerHTML=`<div class="hero">${lg}<h1>مرحباً بك في منصة مستر محمد البهي التدريبية للغة الإنجليزية</h1><p>Mr. Mohamed El-Bahy’s English Training Platform</p><p>📖 شرح &nbsp; ✏️ تدريب &nbsp; 📝 امتحانات</p></div>
<main><div class="card"><h2>اختر صفك · Choose your grade</h2><div class="g12">${GR.map((g,i)=>`<button class="gb${S.grade==i+1?' on':''}" style="--h:${(i+1)*29}" data-g="${i+1}"><b>${i+1}</b><small>الصف ${g}</small></button>`).join('')}</div></div></main>`;
 document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{S.grade=+b.dataset.g;keep();grade()})}
function askName(cb){app.innerHTML=`<div class="bar"><button class="sm" id="bk">← رجوع · Back</button></div><main><div class="card"><h2>اكتب اسمك · Your name</h2><p class="mu">يظهر اسمك للمعلم مع نتيجتك · Your teacher sees it with your result</p><input type="text" id="nm" value="${esc(S.name)}" placeholder="اسمك الكامل · Your full name" autocomplete="off"><button class="btn" id="ok">متابعة · Continue</button><p class="er" id="er"></p></div></main>`;
 $('#bk').onclick=paint;$('#ok').onclick=()=>{const n=$('#nm').value.trim();if(!n){$('#er').textContent='من فضلك اكتب اسمك · Please write your name';return}S.name=n;keep();cb()}}
async function grade(){app.innerHTML='<main><p class="mu" style="text-align:center;margin-top:60px">جاري التحميل · Loading…</p></main>';
 const q=async p=>{try{let r=await fetch(DB+'/'+p+'.json?orderBy='+encodeURIComponent('"grade"')+'&equalTo='+S.grade);if(r.ok)return await r.json()||{};
  r=await fetch(DB+'/'+p+'.json');const j=r.ok?await r.json()||{}:{};return Object.fromEntries(Object.entries(j).filter(([,x])=>x.grade==S.grade))}catch(e){return{}}};
 [L,X]=await Promise.all([q('lessons'),q('exams')]);paint()}
function paint(){const tn=['الترم الأول','الترم الثاني','الترم الثالث'],S3=[['explain','📖','الشرح','Explain'],['practice','✏️','التدريب','Practice'],['exam','📝','الامتحانات','Exams']],ex_=S.sec=='explain';
 const items=Object.entries(ex_?L:X).filter(([,x])=>x.pub!==false&&+x.term==S.term&&(ex_||(x.kind||'practice')==S.sec)).sort((a,b)=>(a[1].ts||0)-(b[1].ts||0));
 app.innerHTML=`<div class="bar"><button class="sm" id="nmb">${S.name?'👋 '+esc(S.name):'👤 اكتب اسمك'}</button><b>الصف ${GR[S.grade-1]}</b><button class="sm" id="chg">الصفوف · Grades</button></div><main>
<div class="pills">${[1,2,3].map(t=>`<button class="pill${S.term==t?' on':''}" data-t="${t}">${tn[t-1]}<small>Term ${t}</small></button>`).join('')}</div>
<div class="g3">${S3.map(([k,i,a,e])=>`<button class="sc c-${k}${S.sec==k?' on':''}" data-s="${k}"><span>${i}</span><b>${a}</b><small>${e}</small></button>`).join('')}</div>
<div class="card">${items.length?items.map(([id,x])=>`<div class="it"><div><b>${esc(x.title)}</b><br><small class="mu">${ex_?'درس · Lesson':cnt(x)+' سؤال · questions'}</small></div><button class="btn" data-id="${id}">${ex_?'اقرأ · Read':'ابدأ · Start'}</button></div>`).join(''):'<p class="mu" style="text-align:center">لا يوجد محتوى هنا بعد · Nothing here yet</p>'}</div></main>`;
 $('#chg').onclick=home;$('#nmb').onclick=()=>askName(paint);document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.term=+b.dataset.t;keep();paint()});
 document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{S.sec=b.dataset.s;keep();paint()});
 document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>ex_?lesson(b.dataset.id):exam(b.dataset.id))}
async function lesson(id){const x=L[id];
 app.innerHTML=`<div class="bar"><button class="sm" id="bk">← رجوع · Back</button><b>${esc(x.title)}</b></div><main><div class="card"><h2>${esc(x.title)}</h2>${(x.body||'').split(/\n+/).filter(Boolean).map(p=>'<p>'+esc(p)+'</p>').join('')}${x.link&&/^https?:\/\//i.test(x.link)?`<a class="btn" href="${esc(x.link)}" target="_blank" rel="noopener">فتح الرابط · Open link</a>`:''}</div>${x.pdf?'<div class="card" id="pf"><p class="mu">جاري تحميل الملف · Loading the file…</p></div>':''}</main>`;
 scrollTo(0,0);$('#bk').onclick=paint;if(!x.pdf)return;const pf=$('#pf');
 try{const r=await fetch(DB+'/pdfs/'+id+'.json'),j=r.ok?await r.json():null;if(!j||!j.b64)throw 0;
  const bin=atob(j.b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  const url=URL.createObjectURL(new Blob([u],{type:'application/pdf'})),nm=esc(j.name||'lesson.pdf');
  pf.innerHTML=`<h2>📄 ${nm}</h2><iframe src="${url}" style="width:100%;height:70vh;border:1px solid var(--bd);border-radius:12px" title="PDF"></iframe><a class="btn" href="${url}" target="_blank" rel="noopener">فتح في صفحة جديدة · Open in a new tab</a><a class="btn" href="${url}" download="${nm}">⬇️ تحميل الملف · Download</a>`}
 catch(e){pf.innerHTML='<p class="er">تعذّر تحميل الملف · Could not load the file</p>'}}
function exam(id){if(!S.name){askName(()=>exam(id));return}xid=id;const x=X[id];ex={secs:Object.values(x.secs||{}).map(c=>({t:esc(c.t||''),p:c.p?'<div class="pass">'+c.p.split(/\n+/).map(l=>'<p>'+esc(l)+'</p>').join('')+'</div>':'',q:Object.values(c.q||{}).filter(q=>q.opts).map(q=>({t:esc(q.text||'').replace(/\n/g,'<br>'),o:Object.values(q.opts).map(esc),a:Object.values(q.ans||{})}))}))};
 let h=`<div class="bar"><button class="sm" id="bk">← رجوع · Back</button><b>${esc(x.title)}</b></div><main>`;
 ex.secs.forEach((s,i)=>{h+=`<div class="card"><h2>${s.t}</h2>${s.p}`;s.q.forEach((q,k)=>{h+=`<div class="q"><b>${k+1}. ${q.t}</b>${q.o.map((o,j)=>`<label class="o"><input type="radio" name="q${i}_${k}" value="${j}"> ${String.fromCharCode(65+j)}. ${o}</label>`).join('')}</div>`});h+='</div>'});
 app.innerHTML=h+'<button class="btn" id="sub">تسليم · Submit</button></main>';scrollTo(0,0);
 $('#bk').onclick=()=>{if(confirm('ترك الاختبار؟ ستضيع إجاباتك · Leave? Your answers will be lost.'))paint()};$('#sub').onclick=submit}
function submit(){let un=0,sc=0,tot=0,wr=[];
 ex.secs.forEach((s,i)=>s.q.forEach((q,k)=>{const c=document.querySelector(`input[name="q${i}_${k}"]:checked`);tot++;if(!c)un++;
  if(c&&q.a.includes(+c.value))sc++;else wr.push({n:(i+1)+'.'+(k+1),t:q.t.replace(/<br>/g,' '),m:c?q.o[+c.value]:'',c:q.a.map(j=>q.o[j]).join(' / ')})}));
 if(un&&!confirm(`تركت ${un} سؤال بدون إجابة، هل تريد التسليم؟ · ${un} unanswered. Submit anyway?`))return;
 const p=tot?Math.round(sc/tot*100):0;
 app.innerHTML=`<div class="hero"><div style="font-size:50px">${p>=80?'🏆':p>=50?'👏':'💪'}</div><h1>${esc(S.name)}</h1><div class="big">${sc} / ${tot}</div><p>${p}%</p></div><main><div class="card"><p id="sv" class="mu">جاري إرسال النتيجة · Sending your result…</p></div>
<div class="card"><h2>مراجعة · Review (${wr.length})</h2>${wr.length?wr.map(w=>`<div class="wr"><b>Q${w.n}</b> ${w.t}<br>إجابتك · Yours: <span class="no">${w.m||'—'}</span><br>الصحيحة · Correct: <span class="ok">${w.c}</span></div>`).join(''):'<p class="ok">ممتاز! كل الإجابات صحيحة · All correct!</p>'}</div><button class="btn" id="bk">رجوع للقائمة · Back to the list</button></main>`;
 scrollTo(0,0);$('#bk').onclick=paint;save(sc,tot,p)}
async function save(sc,tot,p){const el=$('#sv'),x=X[xid];
 try{const r=await fetch(DB+'/results.json',{method:'POST',body:JSON.stringify({name:S.name.slice(0,79),grade:S.grade,term:+x.term||S.term,kind:x.kind||'practice',title:String(x.title||'').slice(0,100),total:sc,max:tot,pct:p,ts:Date.now()})});
 if(!r.ok)throw 0;el.textContent='✓ تم إرسال نتيجتك إلى المعلم · Your result was sent to your teacher'}
 catch(e){el.textContent='⚠ تعذّر إرسال النتيجة، أرِ هذه الشاشة للمعلم · Could not send your result'}}
loadSite().then(home);
</script></body></html>
