<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teacher – Year 5 English</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#5d6679;--ac:#2f5fd0;--bd:#d9deea;--no:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1c212c;--tx:#e8ecf4;--mu:#9aa3b5;--ac:#6f95f2;--bd:#323a4b;--no:#ef7b6e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
main{max-width:900px;margin:0 auto;padding:16px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:14px 0}
h2{font-size:18px;margin:0 0 8px}
input,textarea,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px 10px;width:100%;margin:5px 0}
textarea{min-height:70px}
button{font:inherit;font-weight:600;background:var(--ac);color:#fff;border:1px solid var(--ac);border-radius:10px;padding:9px 14px;cursor:pointer}
button.sec,button.tab{background:transparent;color:var(--ac);border-color:var(--bd)}button.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}.row input,.row select{flex:1;min-width:160px;width:auto}.row input[type=checkbox]{flex:none;min-width:0;width:auto}
.it{padding:6px 0;border-bottom:1px solid var(--bd)}.q{margin:12px 0;padding:10px;border:1px dashed var(--bd);border-radius:10px}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:15px}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu)}
.mu{color:var(--mu);font-size:14px}.er{color:var(--no)}details{white-space:normal}summary{cursor:pointer;color:var(--ac)}
</style></head><body><main>
<div class="card" id="lg"><h2>Teacher login</h2><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button id="go">Log in</button><p class="er" id="er"></p></div>
<div id="app" hidden>
<div class="row"><button class="tab on" id="t1">Scores</button><button class="tab" id="t2">Exams</button><span style="flex:1"></span><button class="sec" id="lo">Log out</button></div>
<div id="v1"><div class="card"><div class="row"><h2 style="margin:0;flex:1">Student scores <span class="mu" id="ct"></span></h2><button id="rf">Refresh</button><button id="dl">Download Excel (CSV)</button></div>
<div class="row"><input id="q" placeholder="Search by name or section"></div><div class="w"><table><thead><tr><th>Name</th><th>Exams</th><th>Total</th><th>%</th><th>Time</th><th>Written answers</th></tr></thead><tbody id="tb"></tbody></table></div></div></div>
<div id="v2" hidden></div></div>
<script>
const DB="https://english-exam-73b64-default-rtdb.europe-west1.firebasedatabase.app",KEY="AIzaSyA5vwsNB_Q5angMowrRIeh5WPnyKM2Yza4";
const $=s=>document.querySelector(s);
const h=(t,p,...c)=>{const e=document.createElement(t);for(const k in p||{}){const v=p[k];if(k==='on')for(const ev in v)e.addEventListener(ev,v[ev]);else if(k==='cls')e.className=v;else if(k in e)e[k]=v;else e.setAttribute(k,v)}c.flat().forEach(x=>e.append(x));return e};
let tok='',rows=[],exams={},active=[],ed=null,edId=null;
const fd=t=>new Date(t).toLocaleString('en-GB',{dateStyle:'short',timeStyle:'short'});
async function api(path,method,body){const r=await fetch(DB+path+'.json?auth='+tok,{method:method||'GET',body:body===undefined?undefined:JSON.stringify(body)});
 if(r.status===401){alert('Your session expired or this account is not allowed. Please log in again.');logout();throw new Error('auth')}
 if(!r.ok)throw new Error(r.status);return r.json()}
function logout(){tok='';$('#app').hidden=true;$('#lg').hidden=false}
$('#lo').onclick=logout;
$('#go').onclick=async()=>{$('#er').textContent='';
 try{const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+KEY,{method:'POST',body:JSON.stringify({email:$('#em').value.trim(),password:$('#pw').value,returnSecureToken:true})});
 const j=await r.json();if(!r.ok)throw 0;tok=j.idToken;$('#lg').hidden=true;$('#app').hidden=false;tab(1);loadScores();loadExams()}
 catch(e){$('#er').textContent='Incorrect email or password.'}};
function tab(n){$('#t1').classList.toggle('on',n==1);$('#t2').classList.toggle('on',n==2);$('#v1').hidden=n!=1;$('#v2').hidden=n!=2;if(n==2)loadExams().then(renderExams)}
$('#t1').onclick=()=>tab(1);$('#t2').onclick=()=>tab(2);
/* ---------- scores ---------- */
const parts=r=>r.parts?r.parts.map(p=>p.title+': '+p.sc+'/'+p.tot).join(' · '):'Exam 1: '+r.e1+' · Exam 2: '+r.e2;
async function loadScores(){$('#ct').textContent='…';
 try{const j=await api('/results')||{};rows=Object.values(j).sort((a,b)=>b.ts-a.ts);draw()}
 catch(e){$('#ct').textContent='Could not load results. Check the database Rules and the email written in them.'}}
function draw(){const k=$('#q').value.trim().toLowerCase(),tb=$('#tb');tb.innerHTML='';
 const L=rows.filter(r=>(r.name||'').toLowerCase().includes(k));$('#ct').textContent='('+L.length+')';
 L.forEach(r=>{const tr=document.createElement('tr');
  [r.name,parts(r),r.total+' / '+r.max,r.pct+'%',fd(r.ts)].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});
  const d=h('details',{},h('summary',{},'View'));(r.writ||[]).forEach(w=>d.append(h('div',{},w)));tr.append(h('td',{},d));tb.appendChild(tr)})}
$('#q').oninput=draw;$('#rf').onclick=loadScores;
$('#dl').onclick=()=>{const e=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const c=['Name,Exams,Total,Max,Percent,Time'].concat(rows.map(r=>[r.name,parts(r),r.total,r.max,r.pct,fd(r.ts)].map(e).join(',')));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+c.join('\n')],{type:'text/csv;charset=utf-8'}));a.download='year5-english-results.csv';a.click()};
/* ---------- exams ---------- */
async function loadExams(){try{exams=await api('/exams')||{};const a=await api('/config/active');active=Object.values(a||{})}catch(e){}}
const newQ=t=>({type:t,text:'',o:['','','',''],c:[false,false,false,false],ans:'',kw:''});
const newSec=()=>({t:'',p:'',q:[newQ('m')]});
const fromDb=x=>({title:x.title||'',secs:Object.values(x.secs||{}).map(s=>({t:s.t||'',p:s.p||'',q:Object.values(s.q||{}).map(q=>{const n=newQ(q.type);n.text=q.text||'';
 if(q.type==='m'){const o=Object.values(q.opts||{});while(o.length<4)o.push('');n.o=o;const a=Object.values(q.ans||{});n.c=o.map((_,i)=>a.includes(i))}
 else if(q.type==='f')n.ans=Object.values(q.ans||{}).join('\n');else n.kw=q.kw||'';return n})}))});
function toDb(){const t=ed.title.trim();if(!t)throw new Error('Please write the exam title.');let n=0;
 const secs=ed.secs.filter(s=>s.q.length).map((s,si)=>({t:s.t.trim(),p:s.p.trim(),q:s.q.map((q,qi)=>{n++;const w='Section '+(si+1)+', question '+(qi+1)+': ';
  const text=q.text.trim();if(!text)throw new Error(w+'the question text is empty.');
  if(q.type==='m'){const o=[],a=[];q.o.forEach((x,i)=>{if(x.trim()){if(q.c[i])a.push(o.length);o.push(x.trim())}});if(o.length<2)throw new Error(w+'add at least two options.');if(!a.length)throw new Error(w+'tick the correct option.');return{type:'m',text,opts:o,ans:a}}
  if(q.type==='f'){const a=q.ans.split('\n').map(x=>x.trim()).filter(Boolean);if(!a.length)throw new Error(w+'write at least one accepted answer.');return{type:'f',text,ans:a}}
  return{type:'w',text,kw:q.kw.trim()}})}));
 if(!n)throw new Error('Add at least one question.');return{title:t,ts:Date.now(),secs}}
function renderExams(){const v=$('#v2'),y=scrollY;v.innerHTML='';if(ed){renderEditor(v);scrollTo(0,y);return}
 const ids=Object.keys(exams).sort((a,b)=>(exams[a].ts||0)-(exams[b].ts||0)),name=id=>exams[id]?exams[id].title:'(deleted)';
 const ac=h('div',{cls:'card'},h('h2',{},'Active exams (students take them in this order)'));
 if(!active.length)ac.append(h('p',{cls:'mu'},'None selected: students currently see the two built-in starter exams.'));
 active.forEach((id,i)=>ac.append(h('div',{cls:'row it'},h('span',{style:'flex:1'},(i+1)+'. '+name(id)),
  h('button',{cls:'sec',textContent:'↑',on:{click:()=>mv(i,-1)}}),h('button',{cls:'sec',textContent:'↓',on:{click:()=>mv(i,1)}}),
  h('button',{cls:'sec',textContent:'Remove',on:{click:()=>{active.splice(i,1);saveActive()}}}))));
 const rest=ids.filter(id=>!active.includes(id));
 if(rest.length){const sel=h('select',{},rest.map(id=>h('option',{value:id,textContent:name(id)})));ac.append(h('div',{cls:'row'},sel,h('button',{textContent:'Add to active',on:{click:()=>{active.push(sel.value);saveActive()}}})))}
 v.append(ac);
 const al=h('div',{cls:'card'},h('div',{cls:'row'},h('h2',{style:'margin:0;flex:1'},'All exams'),h('button',{textContent:'New exam',on:{click:()=>edit(null)}}),h('button',{cls:'sec',textContent:'Import starter exams',on:{click:importStarter}})));
 if(!ids.length)al.append(h('p',{cls:'mu'},'No exams yet. Tap “Import starter exams” to load the two exams made from the revision sheet, or create a new one.'));
 ids.forEach(id=>{const x=exams[id],n=Object.values(x.secs||{}).reduce((s,c)=>s+Object.values(c.q||{}).length,0);
  al.append(h('div',{cls:'row it'},h('span',{style:'flex:1'},x.title+' ',h('span',{cls:'mu'},'('+n+' questions)')),
   h('button',{cls:'sec',textContent:'Edit',on:{click:()=>edit(id)}}),h('button',{cls:'sec',textContent:'Duplicate',on:{click:()=>dup(id)}}),h('button',{cls:'sec',textContent:'Delete',on:{click:()=>del(id)}})))});
 v.append(al)}
function mv(i,d){const j=i+d;if(j<0||j>=active.length)return;[active[i],active[j]]=[active[j],active[i]];saveActive()}
async function saveActive(){try{await api('/config/active','PUT',active.length?active:null)}catch(e){alert('Could not save. Check your connection and the Rules.')}renderExams()}
function edit(id){edId=id;ed=id?fromDb(exams[id]):{title:'',secs:[newSec()]};renderExams();scrollTo(0,0)}
async function dup(id){try{const x=JSON.parse(JSON.stringify(exams[id]));x.title+=' (copy)';x.ts=Date.now();await api('/exams','POST',x);await loadExams()}catch(e){alert('Could not duplicate.')}renderExams()}
async function del(id){if(!confirm('Delete “'+exams[id].title+'”? This cannot be undone.'))return;
 try{await api('/exams/'+id,'DELETE');if(active.includes(id)){active=active.filter(x=>x!==id);await api('/config/active','PUT',active.length?active:null)}await loadExams()}catch(e){alert('Could not delete.')}renderExams()}
async function importStarter(){if(Object.keys(exams).length&&!confirm('Starter exams will be added again as new copies. Continue?'))return;
 try{const L=await(await fetch('starter-exams.json')).json(),ids=[];for(const x of L){x.ts=Date.now()+ids.length;ids.push((await api('/exams','POST',x)).name)}
  await loadExams();if(!active.length){active=ids;await api('/config/active','PUT',active)}}catch(e){alert('Could not import the starter exams.')}renderExams()}
async function saveExam(){let x;try{x=toDb()}catch(e){return alert(e.message)}
 try{if(edId){x.ts=exams[edId].ts||x.ts;await api('/exams/'+edId,'PUT',x)}else await api('/exams','POST',x);ed=null;await loadExams();renderExams();scrollTo(0,0)}catch(e){alert('Could not save. Check your connection and the Rules.')}}
function renderEditor(v){
 v.append(h('div',{cls:'card'},h('h2',{},edId?'Edit exam':'New exam'),h('input',{placeholder:'Exam title, e.g. Exam 3 – Unit 2',value:ed.title,on:{input:e=>ed.title=e.target.value}})));
 ed.secs.forEach((s,si)=>{
  const c=h('div',{cls:'card'},h('div',{cls:'row'},h('b',{style:'flex:1'},'Section '+(si+1)),h('button',{cls:'sec',textContent:'Delete section',on:{click:()=>{if(confirm('Delete this section and its questions?')){ed.secs.splice(si,1);renderExams()}}}})),
   h('input',{placeholder:'Section title, e.g. Reading Comprehension',value:s.t,on:{input:e=>s.t=e.target.value}}),
   h('textarea',{placeholder:'Passage or instructions shown above the questions (optional)',value:s.p,on:{input:e=>s.p=e.target.value}}));
  s.q.forEach((q,qi)=>c.append(qEd(s,q,qi)));
  c.append(h('div',{cls:'row'},h('button',{cls:'sec',textContent:'+ Add question',on:{click:()=>{s.q.push(newQ('m'));renderExams()}}})));
  v.append(c)});
 v.append(h('div',{cls:'row'},h('button',{cls:'sec',textContent:'+ Add section',on:{click:()=>{ed.secs.push(newSec());renderExams()}}}),h('button',{textContent:'Save exam',on:{click:saveExam}}),h('button',{cls:'sec',textContent:'Cancel',on:{click:()=>{ed=null;renderExams()}}})))}
function qEd(s,q,qi){
 const d=h('div',{cls:'q'},h('div',{cls:'row'},h('b',{style:'flex:1'},'Q'+(qi+1)+' · '+({m:'Multiple choice',f:'Fill in the blank',w:'Written sentence'})[q.type]),h('button',{cls:'sec',textContent:'Delete',on:{click:()=>{s.q.splice(qi,1);renderExams()}}})),
  h('textarea',{placeholder:q.type==='f'?'Question text. Put ___ where the blank goes.':'Question text',value:q.text,on:{input:e=>q.text=e.target.value}}));
 if(q.type==='m'){q.o.forEach((o,i)=>d.append(h('div',{cls:'row'},h('input',{type:'checkbox',checked:q.c[i],title:'Correct answer',on:{change:e=>q.c[i]=e.target.checked}}),h('input',{placeholder:'Option '+'ABCDEFGH'[i],value:o,on:{input:e=>q.o[i]=e.target.value}}))));d.append(h('p',{cls:'mu'},'Tick the correct option(s). Empty options are ignored.'))}
 else if(q.type==='f')d.append(h('textarea',{placeholder:'Accepted answers, one per line (capital letters and punctuation are ignored)',value:q.ans,on:{input:e=>q.ans=e.target.value}}));
 else d.append(h('input',{placeholder:'Word the sentence must contain (optional), e.g. could',value:q.kw,on:{input:e=>q.kw=e.target.value}}));
 return d}
</script></main></body></html>
